name: Tests

# Unit tests only, on every PR, every push to main, and by hand.
#
# The XCUITest suite is deliberately NOT here: it takes far longer and needs the simulators and fixtures the local
# test plans set up. UI tests run locally, chosen per docs/DEVELOPMENT.md → Verification scope (test plans in
# TestPlans/). Local verification is the merge gate; this job is a second, automatic check of the unit tests.
#
# No signing secrets are needed: simulator builds do not sign, and the team ID
# lives in Config/Local.xcconfig, which is gitignored and optional (see
# Config/Shared.xcconfig).

on:
  pull_request:
  push:
    branches: [main]
  # Run by hand on any branch (Actions → Tests → Run workflow, or `gh workflow run tests.yml --ref <branch>`), e.g. to
  # prove a CI change before it reaches main.
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    # macos-26, NOT macos-15. D42 raised the minimum to iOS 26.0 for the iPhone
    # HKWorkoutSession API, and macos-15 ships Xcode 16.4, whose newest iOS SDK
    # is 18.5. That runner cannot build this project at all — it failed in 43
    # seconds on 2026-08-25 with nothing but a deployment-target warning to say
    # why. Raising the deployment target silently broke CI; it was merged before
    # anyone noticed, which is the no-PR workflow working exactly as documented.
    #
    # xcode-27, NOT macos-26 (2026-11-14). The app is built with Xcode 27 (27.2 locally); macos-26's newest Xcode is
    # 26.6, whose compiler failed on LiveSetRow.swift — every Tests run from 2026-08-18 to 2026-11-14 failed or was
    # cancelled (none passed). `xcode-27` is GitHub's macOS 27 + Xcode 27 image, a public preview as of 2026-11
    # (https://github.com/actions/runner-images/issues/14404); move to its GA label when there is one.
    runs-on: xcode-27
    # 30 killed all three runs this workflow has ever had (2026-08-18, and twice
    # on 2026-08-22) — always mid-`Unit tests`, never with a diagnosis, because
    # of the two problems fixed in that step below. 60 is not a claim that the
    # job needs an hour; it is room to find out what it actually needs.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # The image's default Xcode may lag the one the app is built with; pick the same one (27.2), else the newest 27.
      - name: Select Xcode
        run: |
          set -euo pipefail
          xcode=/Applications/Xcode_27.2.app
          [ -d "$xcode" ] || xcode=$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode/Contents/Developer"

      - name: Show toolchain
        run: xcodebuild -version

      # Fail here, loudly, rather than 40 seconds later inside xcodebuild with a
      # WARNING as the only clue. A toolchain too old for the deployment target
      # is an environment problem, not a code problem, and the log should say so
      # in one line instead of burying it in 2,000 lines of SwiftCompile.
      - name: Check the toolchain can build this deployment target
        run: |
          set -euo pipefail
          required=$(grep -m1 -oE 'IPHONEOS_DEPLOYMENT_TARGET = [0-9]+'             WorkoutTracker.xcodeproj/project.pbxproj | grep -oE '[0-9]+$')
          have=$(xcrun --sdk iphonesimulator --show-sdk-version | cut -d. -f1)
          echo "project needs iOS ${required}; this runner's newest iOS SDK is ${have}"
          if [ "$have" -lt "$required" ]; then
            echo "::error::Runner SDK iOS ${have} is older than the project's deployment target iOS ${required} (see D42). This is a RUNNER IMAGE problem, not a code problem — the same commit builds locally on Xcode 27. Bump runs-on to an image with Xcode ${required} or later."
            exit 1
          fi

      # Pick a simulator by UDID rather than by name. Locally the scheme targets
      # "WT-iPhone" (CLAUDE.md), which does not exist on a runner; hard-coding
      # "iPhone 16" instead just moves the breakage to the next image update.
      # This takes whatever iPhone the newest installed iOS runtime offers.
      - name: Pick a simulator
        id: sim
        run: |
          set -euo pipefail
          cat > /tmp/pick-simulator.py <<'PY'
          import json, subprocess, sys

          data = json.loads(subprocess.run(
              ["xcrun", "simctl", "list", "devices", "available", "--json"],
              capture_output=True, text=True, check=True).stdout)["devices"]

          def version(runtime):
              tail = runtime.rsplit(".", 1)[-1]          # ...SimRuntime.iOS-18-2
              return tuple(int(p) for p in tail.split("-")[1:] if p.isdigit())

          # A plain numbered iPhone ("iPhone 18 Pro", "iPhone 18"), as the app is tested locally — not whatever sorts
          # last by name: that picked "iPhone Duo" on 2026-11-14, and the unit tests hung there for 50 minutes.
          import re
          def plain(name):
              return 2 if re.fullmatch(r"iPhone \d+ Pro", name) else 1 if re.fullmatch(r"iPhone \d+", name) else 0

          best = None
          for runtime, devices in data.items():
              if "SimRuntime.iOS" not in runtime:
                  continue
              for device in devices:
                  if not device.get("isAvailable") or not device["name"].startswith("iPhone"):
                      continue
                  key = (plain(device["name"]), version(runtime), device["name"])
                  if best is None or key > best[0]:
                      best = (key, device)

          if best is None:
              print("no iPhone simulator available on this runner", file=sys.stderr)
              sys.exit(1)
          print(f"{best[1]['udid']}\t{best[1]['name']}")
          PY
          PICKED=$(python3 /tmp/pick-simulator.py)
          UDID=${PICKED%%$'\t'*}
          NAME=${PICKED##*$'\t'}
          echo "Testing on $NAME ($UDID)"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        # Normal runs take minutes; a hang must end with a named test, not at the job's hour.
        timeout-minutes: 25
        run: |
          set -euo pipefail
          set -o pipefail

          # Why the heartbeat: the grep below matches only lines xcodebuild
          # prints at the very END of a run, so while the build works it
          # correctly prints nothing — and a healthy long build is therefore
          # indistinguishable from a process hung at minute one. All three
          # timeouts so far produced 30 minutes of silence and no diagnosis.
          # This prints where the build actually is, once a minute, without
          # dumping tens of thousands of lines into the log.
          touch xcodebuild.log
          (
            while sleep 60; do
              echo "[heartbeat +$((SECONDS / 60))m] $(tail -n 1 xcodebuild.log 2>/dev/null | cut -c1-140)"
              # Locally the unit tests take ~2 minutes. Still running at 12: record what the test host is doing (its
              # threads' stacks) so a hang names its cause; saved with the log as an artifact.
              if [ $((SECONDS / 60)) -eq 12 ]; then
                for pid in $(pgrep -f 'WorkoutTracker.app/WorkoutTracker' || true); do
                  sample "$pid" 3 -file "hang-sample-$pid.txt" >/dev/null 2>&1 || true
                  echo "--- test host $pid: main thread ---"
                  awk '/Thread_[0-9]+.*DispatchQueue_1: com.apple.main-thread/{p=1} p{print; if (++n>60) exit}' \
                    "hang-sample-$pid.txt" 2>/dev/null | cut -c1-160 || true
                done
              fi
            done
          ) &
          heartbeat=$!
          trap 'kill "$heartbeat" 2>/dev/null || true' EXIT

          # The Unit test plan, as run locally (DEVELOPMENT → Tiers and test plans). A test that runs past the
          # allowance fails by name instead of hanging the job.
          # STACKED_CI=1 in the test host (TestEnvironment.isCI): skips the tests that run on-device text recognition,
          # which hangs on this virtual Mac (2026-11-14); they run locally.
          export TEST_RUNNER_STACKED_CI=1
          xcodebuild test \
            -project WorkoutTracker.xcodeproj \
            -scheme WorkoutTracker \
            -testPlan Unit \
            -sdk iphonesimulator \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log \
            `# xcodebuild's exit code decides pass/fail (set -o pipefail); the` \
            `# grep only decides what is worth printing. A clean simulator logs` \
            `# CoreData "error:" lines while creating the store on first launch,` \
            `# which are noise, not failures.` \
            | grep -E --line-buffered '✘|Test run with|TEST (SUCCEEDED|FAILED)' \
            || (echo "--- compiler errors ---"; grep -E '\.swift:[0-9]+:[0-9]+: error:' xcodebuild.log | sort -u | head -40 || true
                echo "--- last 100 lines ---"; tail -100 xcodebuild.log; exit 1)

      # `always()`, not `failure()`: a timeout cancels the job rather than
      # failing it, so `failure()` skipped this step on all three timeouts and
      # the one artifact that could explain them was discarded with the runner.
      - name: Upload build log
        if: always()
        # The log is a diagnostic: GitHub's artifact service timing out (seen 2026-11-14) must not fail the job.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: |
            xcodebuild.log
            hang-sample-*.txt
          if-no-files-found: ignore
