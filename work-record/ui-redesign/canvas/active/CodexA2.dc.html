.card { background: #171B21; border: 1px solid rgba(255,255,255,0.07); border-radius: 24px; }

.cal { margin-left:auto; color:#B5B9C2; font-size:13px; }

.machine-text small { color:#B5B9C2; font-size:12px; line-height:16px; }
.cols { display:grid; grid-template-columns:44px minmax(0,1fr) 88px 48px 44px; gap:4px; align-items:center; }

.columns span:nth-child(n+3) { text-align:center; }

.set { min-height:48px; border-radius:10px; }
.set + .set { margin-top:4px; }
.set.current { background:#222832; }
.marker { display:flex; align-items:center; justify-content:center; gap:2px; font-size:15px; font-weight:600; width:44px; }

.field input { min-height:44px; border:0; padding:0; min-width:0; width:100%; background:none; text-align:center; font-size:17px; font-weight:600; font-variant-numeric:tabular-nums; outline-offset:0; }
.unit { display:flex; justify-content:center; align-items:center; min-width:44px; width:44px; font-size:12px; color:#B5B9C2; }
.unit span { border-radius:16px; padding:3px 6px; background:#222832; }
.complete { width:44px; height:44px; display:flex; align-items:center; justify-content:center; border-radius:22px; color:#B5B9C2; }
.complete svg { width:22px; height:22px; }
.done .complete { color:#FFB45E; }
.done .field,.planned .field { background:transparent; }
.done .field input,.planned .field input { color:#B5B9C2; font-weight:400; }
.done .unit span,.planned .unit span { background:#222832; }
.current .complete { background:#FFB45E; color:#15110B; }
.current .field input { font-size:17px; }

.dock { flex-shrink:0; margin:0 16px 34px; display:flex; flex-direction:column; gap:12px; }

.countdown { display:flex; align-items:center; gap:10px; }

.rest-actions { display:flex; gap:8px; }

.rest-actions .skip { color:#15110B; background:#FFB45E; font-weight:700; }

.ring44 > div { width:36px; height:36px; border-radius:18px; background:#222832; display:flex; align-items:center; justify-content:center; color:#FFB45E; }

.axl .footer { grid-template-columns:1fr; gap:8px; padding-bottom:16px; }

.axl .time { font-size:44px; line-height:50px; }
.axl .countdown > svg { width:32px; height:32px; }
