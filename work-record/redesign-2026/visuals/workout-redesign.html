<div id="wt-study" aria-label="Workout Tracker redesign proposal">

<script>
(()=>{
const root=document.getElementById('wt-study'),content=document.getElementById('wt-content'),jump=document.getElementById('wt-screen'),nav=document.getElementById('wt-nav'),phone=document.getElementById('wt-phone');
const screens={home:'01 · Workout — Focus',library:'02 · Workout — Library alternative',journal:'03 · Workout — Journal alternative',active:'04 · Active workout',rest:'05 · Rest timer',previous:'06 · Previous performance',equipment:'07 · Equipment & variation',bar:'08 · Bar & plates',exercisePicker:'09 · Add exercise',cardioSetup:'10 · Start cardio',cardio:'11 · Cardio in progress',finish:'12 · Finish receipt',templates:'13 · All templates',template:'14 · Template detail',templateEdit:'15 · Template editor',ai:'16 · Ask AI for Templates',aiReview:'17 · Review generated week',gyms:'18 · Gyms',gym:'19 · Gym & equipment',machine:'20 · Machine detail',scan:'21 · Scan Machine',scanReview:'22 · Confirm recognition',exercises:'23 · Exercise library',exercise:'24 · Exercise & records',history:'25 · History',calendar:'26 · History calendar',session:'27 · Session detail',progress:'28 · Progress chart',settings:'29 · Settings',privacy:'30 · AI settings & consents',restSettings:'31 · Rest settings',export:'32 · Export',empty:'33 · First workout / empty',error:'34 · Connection error',confirm:'35 · Destructive confirmation',live:'36 · Lock Screen activity'};
const saved=window.openai?.widgetState?.privateContent||{};
const state={screen:screens[saved.screen]?saved.screen:'home',large:false,appearance:'System',home:'Focus',done:[true,false,false],resting:false,paused:false,toast:'',days:'3',goal:'Build strength',gym:'Downtown Gym',distance:'km',filter:'All',savedWeek:false,restSeconds:92,activity:'Indoor Run',chartMetric:'Weight',values:[[60,10],[60,10],[62.5,8]],superset:false};
const I=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const B=(text,action,cls='secondary',icon='')=>`<button type="button" class="${cls} cursor-interaction" data-action="${action}">${icon?I(icon):''}${text}</button>`;

const row=(title,sub,action,lead='',trail='')=>`<button type="button" class="row cursor-interaction" data-action="${action}">${lead?`<span class="${lead.length>3?'tile-icon':'ordinal'}">${lead.length>3?I(lead):lead}</span>`:''}<span class="stack"><h3>${title}</h3>${sub?`<span class="small muted">${sub}</span>`:''}</span>${trail?`<span class="trailing">${trail}</span>`:''}${I('chevron-right')}</button>`;
const section=(title,action='',label='See all')=>`<div class="section"><h3>${title}</h3>${action?B(label,action,'quiet'):''}</div>`;
const metric=(value,label)=>`<div class="metric"><strong>${value}</strong><small>${label}</small></div>`;
const field=(label,value,type='text')=>`<label class="field"><span>${label}</span><input type="${type}" value="${value}" aria-label="${label}"></label>`;
const select=(label,options)=>`<label class="field"><span>${label}</span><select aria-label="${label}">${options.map(x=>`<option>${x}</option>`).join('')}</select></label>`;

const gymContext=()=>B(`${state.gym} ${I('chevron-down')}`,'chooseGym','context','map-pin');
const templateRows=()=>row('Upper Body A','Chest, back, shoulders','template','01','5 exercises')+row('Lower Body A','Legs, core','template','02','4 exercises')+row('Full Body + Cardio','Strength, indoor run','template','03','6 activities');
const savedTemplateRows=()=>Array.from({length:Number(state.days)},(_,i)=>row(['Upper Body A','Lower Body A','Full Body + Cardio','Upper Body B','Lower Body B','Full Body B'][i],'5 exercises · 15 working sets','template',String(i+1).padStart(2,'0'))).join('');

content.innerHTML=(state.toast?`<div class="toast" role="status">${I('check')}${state.toast}</div>`:'')+html;jump.value=state.screen;
const group=['history','calendar','session','progress'].includes(state.screen)?'history':['gyms','gym','machine','scanReview'].includes(state.screen)?'gyms':['exercises','exercise'].includes(state.screen)?'exercises':'home';
nav.innerHTML=[['home','Workout','dumbbell'],['history','History','history'],['gyms','Gyms','building-2'],['exercises','Exercises','list']].map(([s,t,i])=>`<button type="button" class="cursor-interaction ${s===group?'active':''}" data-action="${s}" ${s===group?'aria-current="page"':''}>${I(i)}<span>${t}</span></button>`).join('');nav.hidden=state.screen==='live';
root.querySelectorAll('button').forEach(b=>b.type='button');if(globalThis.lucide)lucide.createIcons({attrs:{width:20,height:20}});
}
function persist(){window.openai?.setWidgetState?.({modelContent:{screen:screens[state.screen],direction:state.home,appearance:state.appearance},privateContent:{screen:state.screen}})?.catch(()=>{});}
function go(screen){state.toast='';state.screen=screen;render();persist();}
root.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn||!root.contains(btn))return;const a=btn.dataset.action;if(screens[a]){go(a);return;}state.toast='';if(a.startsWith('set:')){let i=Number(a.split(':')[1]);state.done[i]=!state.done[i];state.resting=state.done[i];state.screen='active';state.restSeconds=120;}else if(a==='addSet'){state.done.push(false);state.values.push([...(state.values[state.values.length-1]||[60,10])]);}else if(a==='addRest'){state.restSeconds+=30;}else if(a==='skipRest'){state.resting=false;state.screen='active';}else if(a==='pause'){state.paused=!state.paused;}else if(a.startsWith('days:'))state.days=a.slice(5);else if(a.startsWith('goal:'))state.goal=a.slice(5);else if(a.startsWith('filter:'))state.filter=a.slice(7);else if(a==='saveWeek'){state.savedWeek=true;state.screen='templates';state.toast=`${state.days} templates saved`;}else if(a==='saveMachine'){state.screen='ai';state.toast='Machine added to Downtown Gym';}else if(a==='saveTemplate'){state.screen='template';state.toast='Template saved';}else if(a==='deleteTemplate'){state.screen='templates';state.toast='Template deleted · workouts kept';}else if(a==='large'){state.large=!state.large;}else if(a==='appearance'){state.appearance=state.appearance==='Dark'?'Light':'Dark';}else if(a==='chooseGym'){state.gym=state.gym==='Downtown Gym'?'No gym':'Downtown Gym';}else if(a==='addExercise'){state.screen='active';state.toast='Exercise added';}else if(a==='endCardio'){state.screen='active';state.toast='Indoor Run saved · 2.48 km';}else if(a==='closeFinish'){state.screen='home';}else if(a==='selectMachine'){state.toast='Machine selected';}else if(a.startsWith('selectCardio:')){state.activity=a.slice(13);}else if(a==='genericMachine'){content.querySelector('input[aria-label="Model"]').value='';state.toast='';return;}else if(a.startsWith('day:')){state.screen='session';}else if(a.startsWith('chartMetric:')){state.chartMetric=a.slice(12);}else{const messages={exportJSON:'Preview · JSON share sheet would open',exportCSV:'Preview · CSV share sheet would open',saveKey:'Preview · key saved',removeKey:'Preview · remove-key confirmation',units:'Preview · Metric / U.S. customary picker',heartZones:'Preview · measured maximum or date of birth',drift:'Preview · template update preference',motion:'Motion follows the iPhone Reduce Motion setting',manualDistance:'Preview · correct distance, keeping the entered unit',editSession:'Preview · edit history, rename, save as template',addGym:'Preview · gym name, location, unit and notes',newExercise:'Preview · exercise name, load type and equipment'};state.toast=messages[a]||'Preview selection updated';}render();persist();});
root.addEventListener('input',e=>{if(e.target.dataset.set!==undefined){const i=Number(e.target.dataset.set),f=Number(e.target.dataset.field);if(!state.values[i])state.values[i]=[60,10];state.values[i][f]=e.target.value;}if(e.target.type==='search'){const q=e.target.value.toLowerCase();content.querySelectorAll('.row').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(q));}});
jump.innerHTML=Object.entries(screens).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');jump.addEventListener('change',()=>go(jump.value));render();
if(globalThis.Tweak){const t=new Tweak({container:phone,onChange:render});t.addSelect(state,'home',{label:'Workout composition',options:['Focus','Library','Journal']});t.addSelect(state,'appearance',{label:'Appearance',options:['System','Light','Dark']});t.addToggle(state,'large',{label:'Large text layout'});}
window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent?.screen;if(screens[s]){state.screen=s;render();}});
})();
</script>
